schema_version: 1

context:
  name: opentelemetry-instrumentation-openai-agents
  version: "0.62.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_openai_agents-${{ version }}.tar.gz
  sha256: 4217916a05af6d75fda7f45efe9c24f5deb679e0441f9932aea091c752619e65

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - openai-agents >=0.2.7,<1
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.openai_agents"
      - pip check

about:
  summary: OpenTelemetry OpenAI instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
